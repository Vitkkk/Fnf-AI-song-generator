[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnf-ai-song-generator"
version = "0.1.0"
description = "Experimental from-scratch FNF stem-aware music generator"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "numpy>=1.26",
  "soundfile>=0.12",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
